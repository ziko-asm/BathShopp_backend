<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bathshop.az - Hamam və Banyo Məhsulları</title>
    <!-- FontAwesome ikonlar üçün -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Yuxarı Naviqasiya -->
    <header class="site-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #fff; border-bottom: 1px solid #eee;">
        <div class="logo-area" style="display: flex; align-items: center; gap: 10px;">
            <img src="logo.png" alt="BathShop" style="height: 40px;">
            <span style="font-size: 20px; font-weight: bold; color: #0066ff;">bathshop.az</span>
        </div>

        <div style="display: flex; align-items: center; gap: 15px;">
            <!-- Dil Seçimi (AZ, EN, RU) -->
            <select id="language-select" onchange="changeLanguage(this.value)" style="padding: 6px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer;">
                <option value="az" selected>AZ</option>
                <option value="en">EN</option>
                <option value="ru">RU</option>
            </select>

            <div class="location-badge" style="background: #eef2ff; color: #0066ff; padding: 8px 15px; border-radius: 20px; font-size: 14px;">
                <i class="fas fa-map-marker-alt"></i> <span id="location-text">Bakı, Azərbaycan</span>
            </div>

            <!-- Səbət Düyməsi -->
            <button onclick="toggleCart()" style="background: #0066ff; color: white; border: none; padding: 10px 15px; border-radius: 10px; cursor: pointer; position: relative;">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count" style="position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px;">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Bölməsi -->
    <section style="background: linear-gradient(135deg, #0066ff, #00c6ff); color: white; text-align: center; padding: 50px 20px;">
        <h1 id="hero-title" style="font-size: 32px; margin-bottom: 10px;">Eviniz üçün Ən Keyfiyyətli Banyo Məhsulları</h1>
        <p id="hero-sub" style="font-size: 16px; opacity: 0.9;">Bakı daxili sürətli çatdırılma və rəsmi zəmanət | Əlaqə: 077 611 02 33</p>
    </section>

    <!-- Məhsullar və Kateqoriya Filtrləri -->
    <main style="max-width: 1200px; margin: 30px auto; padding: 0 20px;">
        <h2 id="products-title" style="margin-bottom: 20px;">Məhsullarımız</h2>

        <!-- Kateqoriya Filtrləri Düymələri -->
        <div style="display: flex; gap: 10px; margin-bottom: 25px;">
            <button id="btn-all" class="filter-btn active" onclick="filterProducts('all')" style="padding: 8px 20px; border-radius: 8px; border: 1px solid #0066ff; background: #0066ff; color: white; cursor: pointer;">Hamısı</button>
            <button id="btn-heater" class="filter-btn" onclick="filterProducts('heater')" style="padding: 8px 20px; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #333; cursor: pointer;">Qızdırıcılar</button>
            <button id="btn-kombi" class="filter-btn" onclick="filterProducts('kombi')" style="padding: 8px 20px; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #333; cursor: pointer;">Kombilər</button>
        </div>

        <!-- Məhsulların Grid Konteyneri -->
        <div id="products-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;"></div>
    </main>

    <!-- Səbət Modalı -->
    <div id="cart-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: flex-end;">
        <div style="background: white; width: 400px; height: 100%; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                    <h3>Səbətiniz</h3>
                    <button onclick="toggleCart()" style="background: none; border: none; font-size: 18px; cursor: pointer;">✕</button>
                </div>
                <div id="cart-items" style="margin-top: 20px; max-height: 50vh; overflow-y: auto;"></div>
            </div>

            <div style="border-top: 1px solid #eee; padding-top: 15px;">
                <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px;">
                    <span>Cəmi:</span>
                    <span><span id="cart-total">0.00</span> ₼</span>
                </div>

                <!-- Checkout Form -->
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="text" id="customer-name" placeholder="Ad və Soyad (Məs: Əli Əliyev)" style="padding: 8px; border: 1px solid #ccc; border-radius: 6px;">
                    
                    <div style="display: flex; gap: 6px;">
                        <select id="country-code" onchange="updatePhoneMask()" style="padding: 8px; border: 1px solid #ccc; border-radius: 6px;">
                            <option value="+994" data-length="9">+994 (AZ)</option>
                            <option value="+90" data-length="10">+90 (TR)</option>
                            <option value="+7" data-length="10">+7 (RU)</option>
                            <option value="+44" data-length="10">+44 (UK)</option>
                        </select>
                        <input type="text" id="customer-phone" placeholder="0705642378" maxlength="9" style="padding: 8px; border: 1px solid #ccc; border-radius: 6px; flex: 1;">
                    </div>
                    <small id="phone-hint" style="color: #666; font-size: 11px;">Nömrəni kodsuz daxil edin (9 rəqəm)</small>

                    <div id="checkout-error" style="color: red; font-size: 12px; display: none;"></div>

                    <button onclick="checkoutOrder()" style="background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Sifarişi Təsdiq Et</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Məhsul Detal Modalı -->
    <div id="product-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
        <div style="background: white; width: 500px; padding: 25px; border-radius: 10px; position: relative; max-height: 80vh; overflow-y: auto;">
            <button onclick="closeProductModal()" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 18px; cursor: pointer;">✕</button>
            <div id="modal-product-details"></div>
        </div>
    </div>

    <!-- Uğurlu Sifariş Modalı -->
    <div id="success-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 10px; text-align: center;">
            <i class="fas fa-check-circle" style="font-size: 50px; color: #28a745; margin-bottom: 15px;"></i>
            <h3>Sifarişiniz uğurla qəbul edildi!</h3>
            <p>Tezliklə sizinlə əlaqə saxlanılacaq.</p>
            <button onclick="closeSuccessModal()" style="margin-top: 15px; background: #0066ff; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer;">Bağla</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
