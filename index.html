<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bathshop.az - Hamam və Banyo Aksessuarları</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Naviqasiya -->
    <header>
        <div class="logo-container">
            <img src="bathshop.jpeg" alt="Bath Shop Logo" class="site-logo">
            <span class="domain-name">bathshop.az</span>
        </div>
        <div class="header-right">
            <div class="location-badge">
                <i class="fas fa-map-marker-alt"></i> Bakı, Azərbaycan
            </div>
            <div class="cart-btn" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Əsas Banner -->
    <!-- Əsas Banner -->
    <section class="hero-banner">
        <h1>Eviniz üçün Ən Keyfiyyətli Banyo Məhsulları</h1>
        <p>Bakı daxili sürətli çatdırılma və rəsmi zəmanət | Əlaqə: 077 611 02 33</p>
        <div class="hero-badges">
            <div class="hero-chip"><i class="fas fa-truck"></i> Sürətli Çatdırılma</div>
            <div class="hero-chip"><i class="fas fa-shield-alt"></i> Rəsmi Zəmanət</div>
            <div class="hero-chip"><i class="fas fa-check-circle"></i> Orijinal Məhsullar</div>
        </div>
    </section>

    <!-- Məhsul Kataloqu -->
    <main class="container">
        <h2>Məhsullarımız</h2>
        <div class="products-grid" id="products-container">
            <!-- Məhsullar JavaScript ilə bura yüklənəcək -->
        </div>
    </main>

    <!-- Məhsul Detal Modalı -->
    <div class="modal" id="product-modal" onclick="if(event.target === this) closeProductModal()">
        <div class="modal-content product-detail-content">
            <button class="modal-close-btn" onclick="closeProductModal()">&times;</button>
            <div id="modal-product-details">
                <!-- JavaScript ilə dolacaq -->
            </div>
        </div>
    </div>

    <!-- Səbət Modalı -->
<!-- Səbət Modalı -->
<div id="cart-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="toggleCart()">&times;</span>
        <h2>Səbətiniz</h2>
        <div id="cart-items"></div>
        <div class="cart-summary">
            <h3>Ümumi Məbləğ: <span id="cart-total">0</span> AZN</h3>
        </div>

        <!-- SİFARİŞ FORMASI -->
        <div class="checkout-form" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
            <div style="margin-bottom: 10px;">
                <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">Ad və Soyadınız:</label>
                <input type="text" id="customer-name" placeholder="Məs: Əli Əliyev" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box;">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:2px;">Əlaqə nömrəniz:</label>
                <span style="display:block; font-size:11px; color:#666; margin-bottom:4px;">Nömrənizi bu formatda daxil edin: 0705642378</span>
                <input type="text" id="customer-phone" placeholder="0705642378" maxlength="10" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box;">
            </div>
            
            <!-- BU XƏTA DİV-İ MÜTLƏQ OLMALIDIR! -->
            <div id="checkout-error" style="color:red; font-size:12px; margin-bottom:10px; display:none;"></div>

            <button onclick="checkoutOrder()" class="checkout-btn" style="width:100%; padding:12px; background:#00875a; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Sifarişi Rəsmiləşdir</button>
        </div>
    </div>
</div>
